name: daily-report

# Runs after the NSE close (15:30 IST = 10:00 UTC) on weekdays and commits the
# day's report into reports/. Market holidays simply produce the same numbers.
on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . tabulate
      - run: python -m market_predictor report --symbol NIFTY50 --horizon 5 --refresh
      - run: python -m market_predictor scan --capital 200000 --risk 1 --top 15 | tee reports/latest_scan.txt
      - name: commit report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add reports/*.md reports/latest_scan.txt
          git commit -m "report: $(date -u +%F)" || echo "nothing to commit"
          git push
